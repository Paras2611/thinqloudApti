services:
  - type: web
    name: thinqloudapti
    env: node
    region: singapore
    plan: free
    buildCommand: cd backend && npm install
    startCommand: cd backend && npm run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: aptitude-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: aptitude-redis
          type: redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        value: paras.jagadish.patil@gmail.com
      - key: ADMIN_PASSWORD
        sync: false # Set manually in Render dashboard
      - key: FRONTEND_URL
        sync: false # Set after Vercel deploy

databases:
  - name: aptitude-db
    plan: free
    databaseName: aptitude_test
    user: aptitude_user

  - name: aptitude-redis
    type: redis
    plan: free
